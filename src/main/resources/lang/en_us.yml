    notify: '<prefix> &eYou left the claim &f<name>'
    actionbar: '&eLeft claim &f<name>'
protection:
  denied: '<prefix> &cYou are not allowed to do that in this claim'
owner_type:
  player: 'Player'
  group: 'Group'
  server: 'Server'
hook:
  vault:
    missing: '<prefix> &eVault not found; economy features (buying blocks / claim bank) are disabled, everything else is unaffected'
    no_provider: '<prefix> &eVault is installed but no economy provider is registered; economy features remain disabled'
    hooked: '<prefix> &aHooked into the Vault economy: &f<name>'
    api_missing: '<prefix> &eVault API not found; economy features remain disabled'
    adapter_failed: '<prefix> &cFailed to initialize the Vault economy adapter; economy features remain disabled: &f<reason>'
upkeep:
  debt:
    warning: '<prefix> &eThe bank of claim &f<name>&e cannot cover this upkeep payment and it has entered the debt grace period; please deposit funds soon or the claim will be released automatically'
    released: '<prefix> &cClaim &f<name>&c has been released automatically after the unpaid grace period (&f<chunks>&c chunks returned to the wild)'
  inactivity:
    warning: '<prefix> &eClaim &f<name>&e has been inactive for too long and entered the reclamation grace period; an owner member must log in before it expires or the claim will be released'
    released: '<prefix> &cClaim &f<name>&c has been released automatically due to prolonged inactivity (&f<chunks>&c chunks returned to the wild)'
  orphan:
    warning: '<prefix> &eThe owner entity of claim &f<name>&e no longer exists (group disbanded or provider unregistered); it entered the orphan grace period and will be released automatically unless an administrator handles it'
    released: '<prefix> &cOrphan claim &f<name>&c was not taken over within the grace period and has been released automatically (&f<chunks>&c chunks returned to the wild)'
