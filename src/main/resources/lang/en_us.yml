command:
  no_perm: '<prefix> &cYou do not have permission to use this command'
  player_only: '<prefix> &cOnly players can execute this command'
  version: '<prefix> &aCurrent LandGuard version: &f<version>'
  reload:
    reloading: '<prefix> &aThe plugin is reloading, please wait'
    success: '<prefix> &aPlugin reloaded successfully'
    exception: '<prefix> &cAn error occurred during plugin reload, check the console'
  claim:
    success: '<prefix> &aClaimed &f<count>&a chunk(s). Remaining quota: &f<available>'
    usage: '<prefix> &eUsage: &f/land claim&7 (standing chunk)&e, &f/land claim radius <n>&7 (square area)&e, &f/land claim auto&7 (toggle walk auto-claim)'
    radius_invalid: '<prefix> &cRadius must be an integer not less than 1'
    radius_too_large: '<prefix> &cRadius exceeds the limit, maximum is <max>'
    auto_on: '<prefix> &aWalk auto-claim enabled: entering new chunks will claim them automatically'
    auto_off: '<prefix> &eWalk auto-claim disabled'
    skipped: '<prefix> &eSkipped &f<count>&e chunk(s) that are already claimed'
    group_not_found: '<prefix> &cNo such group; use the group id'
    auto_group_invalid: '<prefix> &cWalk auto-claim disabled: you cannot claim for that group (missing permission or group gone)'
  boundary:
    on: '<prefix> &aClaim boundary rendering enabled; a particle outline will show when you enter a claim'
    off: '<prefix> &eClaim boundary rendering disabled'
  unclaim:
    success: '<prefix> &eReleased &f<count>&e chunk(s), refunded &f<refunded>&e quota. Remaining quota: &f<available>'
    usage: '<prefix> &eUsage: &f/land unclaim&7 (release the standing chunk)&e, &f/land unclaim auto&7 (toggle walk auto-unclaim)'
    auto_on: '<prefix> &aWalk auto-unclaim enabled: entering your own claim (or a group claim you lead) will release that chunk (walk auto-claim disabled)'
    auto_off: '<prefix> &eWalk auto-unclaim disabled'
  list:
    header: '<prefix> &aYour claims (<size>):'
    entry: '&8- &f<name> &7[<world>] &7chunks: &f<chunks>'
    empty: '<prefix> &7You have no claims yet. Use &f/land claim &7to claim the chunk you stand on'
  info:
    unclaimed: '<prefix> &7This is the &fwilderness&7, protected by no claim rules'
    header: '<prefix> &aClaim info:'
    name: '&8- &7Name: &f<name>'
    owner: '&8- &7Owner: &f<owner> &7(<type>)'
    world: '&8- &7World: &f<world>'
    chunks: '&8- &7Chunks: &f<chunks>'
    created: '&8- &7Created: &f<created>'
  fail:
    overlap: '<prefix> &cTarget chunks are already claimed; claims cannot overlap'
    not_adjacent: '<prefix> &cTarget chunks are not adjacent to your existing land'
    quota_exceeded: '<prefix> &cNot enough chunk quota. Earn more by playing or buying'
    invalid_targets: '<prefix> &cInvalid claim target'
    not_claimed: '<prefix> &cThe chunk you stand on is not claimed'
    not_owner: '<prefix> &cThis is not your land'
    not_permitted: '<prefix> &cYour identity is not permitted to do that'
    invalid_name: '<prefix> &cA claim name must be non-empty and at most 32 characters'
    already_owned: '<prefix> &cThis claim already belongs to that player'
    target_has_claim: '<prefix> &cThat player already owns a claim in this world; each player may own only one claim per world'
  rename:
    usage: '<prefix> &eUsage: &f/land rename <new name> &7(spaces allowed)'
    success: '<prefix> &aClaim renamed to &f<name>'
  transfer:
    usage: '<prefix> &eUsage: &f/land transfer --player <player>&7 or &f/land transfer --group <group>&7 (transfers the claim you stand on; owner only)'
    success: '<prefix> &aTransferred the claim you stand on to &f<player>'
    group_success: '<prefix> &aThe claim under your feet was transferred to group &f<group>&a; chunks and settings kept'
    fail:
      player_not_found: '<prefix> &cPlayer not found (must be online or have joined this server before)'
      group_not_found: '<prefix> &cGroup not found (the group id must match exactly)'
  group:
    usage: '<prefix> &eUsage: &f/land group create|disband|invite|accept|deny|leave|kick|transfer|rename|role|list|info&7; to give a claim to a group use &f/land transfer --group <group id>'
    create:
      success: '<prefix> &aGroup &f<group>&a created; you are the leader'
    disband:
      success: '<prefix> &eGroup &f<group>&e disbanded; its claims are now orphaned and await an admin'
    invite:
      sent: '<prefix> &aInvited &f<player>&a to group &f<group>'
      received: '<prefix> &a<leader> invited you to group &f<group>&a. Use &f/land group accept <group_id>&a to join'
    accept:
      success: '<prefix> &aYou joined group &f<group>&a; permissions are effective immediately'
    deny:
      success: '<prefix> &eYou declined the invitation to group &f<group>'
    leave:
      success: '<prefix> &eYou left group &f<group>&e; permissions revoked immediately'
    kick:
      success: '<prefix> &eKicked &f<player>&e from group &f<group>&e; permissions revoked immediately'
    transfer:
      success: '<prefix> &aLeadership of &f<group>&a transferred to &f<player>&a; you are now a manager'
    rename:
      usage: '<prefix> &eUsage: &f/land group rename <group id> <new display name>'
      success: '<prefix> &aGroup display name changed to &f<group>&a (the group id is unchanged)'
    role:
      assigned: '<prefix> &a<player> is now &f<role>&a in &f<group>&a; permissions effective immediately'
      list_header: '<prefix> &aIdentities (<size>):'
      list_entry: '&8- &f<id> &7(<name>&7) priority &f<priority>&7, permissions &f<permissions>&7, behaviors &f<behaviors>'
      list_group_entry: '&8- &f<id> &7(<name>&7) priority &f<priority>&7, members &f<members>'
    list:
      header: '<prefix> &aYour groups (<size>):'
      entry: '&8- &f<group> &7[&f<group_id>&7]'
      empty: '<prefix> &7You are not in any group yet. Use &f/land group create <group id> [display name]'
    info:
      header: '<prefix> &aGroup info:'
      name: '&8- &7Name: &f<group> &7[&f<group_id>&7]'
      leader: '&8- &7Leader: &f<leader>'
      members: '&8- &7Members: &f<members>'
      roles: '&8- &7Roles: &f<roles>'
    fail:
      key_taken: '<prefix> &cThat group id is already taken'
      invalid_key: '<prefix> &cInvalid group id (1-32 lowercase letters, digits or underscores)'
      invalid_name: '<prefix> &cInvalid display name (non-empty, up to 32 characters)'
      not_found: '<prefix> &cGroup not found'
      not_leader: '<prefix> &cThis action requires a higher identity'
      not_manager: '<prefix> &cYour identity cannot manage this group'
      not_member: '<prefix> &cYou are not a member of that group'
      target_not_member: '<prefix> &cThe target player is not a member of that group'
      already_member: '<prefix> &cThat player is already a group member'
      no_invite: '<prefix> &cYou have no pending invitation for that group'
      leader_cannot_leave: '<prefix> &cThe leader cannot leave; transfer leadership or disband first'
      cannot_kick: '<prefix> &cYou cannot kick that member (managers/leader are protected)'
      cannot_assign: '<prefix> &cYour identity cannot assign this member to that identity'
      identity_not_found: '<prefix> &cNo such identity; see identities.yml'
      claim_not_found: '<prefix> &cThe chunk under your feet is not claimed'
      not_claim_owner: '<prefix> &cOnly your own personal claim can be transferred to a group'
      group_has_claim: '<prefix> &cThat group already owns a claim in this world'
      group_quota_exceeded: '<prefix> &cThat group does not have enough chunk quota for this claim'
      target_not_found: '<prefix> &cPlayer not found (must be online or cached from a previous login)'
  economy:
    unavailable: '<prefix> &cEconomy is unavailable (no Vault economy installed or disabled); trading and bank are disabled'
    usage: '<prefix> &eUsage: &f/land buy|sell <chunks>'
    invalid_amount: '<prefix> &cInvalid amount; please enter a number greater than 0'
    insufficient_funds: '<prefix> &cYou do not have enough money'
    quota_in_use: '<prefix> &cThat quota is in use by claimed chunks; unclaim chunks before selling'
    nothing_to_sell: '<prefix> &cYou do not have that much purchased quota to sell'
  buy:
    success: '<prefix> &aPurchased &f<chunks> &achunk quota for &f<cost>&a; balance: &f<balance>'
  sell:
    success: '<prefix> &aSold &f<chunks> &achunk quota for &f<refund>&a; balance: &f<balance>'
  bank:
    usage: '<prefix> &eUsage: &f/land bank [deposit|withdraw <amount>]'
    balance: '<prefix> &aClaim bank balance: &f<balance>'
    deposit:
      success: '<prefix> &aDeposited &f<amount>&a into the claim bank; balance: &f<balance>'
    withdraw:
      success: '<prefix> &aWithdrew &f<amount>&a from the claim bank; balance: &f<balance>'
    unclaimed: '<prefix> &cThe chunk under your feet is not claimed; bank unavailable'
    forbidden: '<prefix> &cYour role is not allowed to withdraw from this claim bank'
    empty: '<prefix> &cThe claim bank does not have enough funds'
  admin:
    usage: '<prefix> &eUsage: &f/land admin claim|unclaim [radius]&7, &ftransfer <player>&7, &frelease <claimId>&7, &fexempt <true|false>&7, &frename <new name>&7, &finfo&7, &forphans&7, &frun'
    claim:
      success: '<prefix> &aCreated an admin claim (owned by server) covering &f<count>&a chunks; quota/adjacency limits and upkeep do not apply'
    unclaim:
      success: '<prefix> &eForce-unclaimed &f<count>&e chunks (ownership not checked, no quota refund)'
    release:
      success: '<prefix> &eForce-released claim &f<claim>&e (&f<chunks>&e chunks returned to the wild)'
    transfer:
      success: '<prefix> &aClaim force-transferred to &f<player>&a (&f<chunks>&a chunks); upkeep/exempt state has been reset'
    exempt:
      set: '<prefix> &aUpkeep/reclamation exemption for this claim is now &f<exempt>'
    rename:
      success: '<prefix> &aRenamed claim &f<claim>&a to &f<name>'
    run:
      done: '<prefix> &aManual maintenance cycle finished: &f<charged>&a claims fully charged, &f<released>&a claims released'
    info:
      admin: '&8- &7Admin claim: &f<admin> &7| ID: &f<claim>'
      exempt: '&8- &7Exempt from upkeep/reclamation: &f<exempt>'
      orphan: '&8- &7Orphaned: &f<orphan>'
    orphans:
      header: '<prefix> &eOrphan claims (<size>):'
      entry: '&8- &f<name> &7[<type>:<owner>] &7chunks: &f<chunks> &7orphaned for &f<days>&7d &7ID: &f<claim>'
      empty: '<prefix> &7There are currently no orphan claims'
    fail:
      claim_not_found: '<prefix> &cThe specified claim does not exist, or you are not standing in one'
      invalid_player: '<prefix> &cPlayer not found (must be online or have joined this server before)'
      already_owned: '<prefix> &cThis claim already belongs to that player'
      invalid_argument: '<prefix> &cInvalid argument, please check the usage'
claim:
  enter:
    notify: '<prefix> &aYou entered the claim &f<name>&a, owner: &f<owner>&7 (<type>)'
    actionbar: '&aEntered claim &f<name> &7| &aOwner: &f<owner> &7(<type>)'
